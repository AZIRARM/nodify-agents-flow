services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  runner:
    build: .
    ports:
      - "${RUNNER_PORT:-5700}:5000"
    environment:
      - NODIFY_API_URL=${NODIFY_API_URL}
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:0.5b}
      - SAVE_TO_NODIFY=${SAVE_TO_NODIFY:-true}
    depends_on:
      - ollama
    restart: unless-stopped

volumes:
  ollama_data: